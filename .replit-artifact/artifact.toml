kind = "web"
previewPath = "/"
title = "Bug Tracker Workspace"
description = "A modern issue tracking workspace that replaces status sprawl with a clear stage and resolution workflow, helping product teams triage, ship, and verify bugs with a complete audit trail."
version = "1.0.0"
id = "artifacts/bug-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24577

[services.development]
run = "pnpm --filter @workspace/bug-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bug-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/bug-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24577"
BASE_PATH = "/"
